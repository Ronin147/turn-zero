services:
  # ── Development ─────────────────────────────────────────────────────────────
  dev:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      - NODE_ENV=development

  # ── Production (local preview) ───────────────────────────────────────────────
  prod:
    build:
      context: .
      target: production
    ports:
      - "8080:80"
    profiles:
      - prod

volumes:
  node_modules:
